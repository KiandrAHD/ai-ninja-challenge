<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ninja Challenge</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">

        <header class="game-header">
            <h1 class="title">🥷 AI NINJA <span>CHALLENGE</span></h1>
            <p class="subtitle">Train Your AI, Become the Ninja!</p>
        </header>

        <div class="status-bar">
            <div class="status-box">
                <span class="label">LEVEL</span>
                <span id="level-value">1 - ROOKIE</span>
            </div>
            <div class="status-box">
                <span class="label">SCORE</span>
                <span id="score-value">0</span>
            </div>
            <div class="status-box">
                <span class="label">COMBO</span>
                <span id="combo-value">x0</span>
            </div>
            <div class="status-box">
                <span class="label">HP</span>
                <span id="hp-value">❤️❤️❤️</span>
            </div>
        </div>

        <div class="arena">

            <div class="challenge-panel">
                <div id="countdown-overlay" class="countdown hidden">3</div>
                <div class="challenge-box">
                    <p class="challenge-label">CHALLENGE</p>
                    <p id="challenge-text">-</p>
                </div>
                <div class="timer-box">
                    <span class="label">TIME</span>
                    <span id="timer-value">-</span>
                </div>
                <div id="result-text" class="result-text">Tekan START untuk mulai training!</div>
            </div>

            <div class="webcam-panel">
                <div id="webcam-container"></div>
                <div class="ai-detection">
                    <p class="label">AI DETECTION</p>
                    <p id="prediction-text">-</p>
                    <p class="confidence-line">Confidence: <span id="confidence-text">0%</span></p>
                </div>
            </div>

        </div>

        <button id="start-btn">🥷 START NINJA TRAINING</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="/script.js"></script>
</body>

</html>
